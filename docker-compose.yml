services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amsh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amsh}  # development default; set a real one outside local use
      POSTGRES_DB: amsh
    ports:
      - "5434:5432"
    volumes:
      - amsh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amsh -d amsh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://amsh:${POSTGRES_PASSWORD:-amsh}@postgres:5432/amsh
      UVICORN_ARGS: "--reload"  # development only: docker-compose.prod.yml turns this off
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Development tunnel for provider webhooks: start with `docker compose --profile tunnel up`.
  ngrok:
    profiles: ["tunnel"]
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "--domain=${NGROK_DOMAIN}"
      - "host.docker.internal:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - api

volumes:
  amsh_postgres_data:

