name: CI

on:
  push:
    branches: [main, complete, "v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      # The offline suite: no network, no real SMS, no database server (it uses in-memory SQLite). Live-model evals are run by hand.
      - run: python -m pytest backend/ai/evals -q -p no:cacheprovider
        env:
          PYTHONPATH: .
          AMSH_DISABLE_SMS: "1"
      # The real app on a throwaway SQLite database: migrations, auth, alerts, spend report, playground test mode (testing/README.md).
      - run: python testing/api_smoke.py
        env:
          PYTHONPATH: .

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
        continue-on-error: true  # reported, not blocking: a new advisory should not stop an unrelated change
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: frontend/user
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: frontend/admin

  frontend:
    name: ${{ matrix.app }} app
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, admin]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx next build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api

  compose:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: touch .env && docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env:
          NGROK_DOMAIN: example.ngrok-free.dev
