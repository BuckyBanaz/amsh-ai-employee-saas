name: clinic
version: 1.0.0
language: nl
display_name: Medische en Tandheelkundige Praktijk (Dutch)
description: AI Medisch Receptionist voor poliklinieken, tandartspraktijken en artsen in het Nederlands.

terminology:
  customer_label: Patiënt
  provider_label: Dokter / Arts
  booking_label: Afspraak
  catalog_label: Behandelingen & Procedures

greeting_template: "Hallo, bedankt voor uw oproep naar {business_name}. Ik ben de AI-receptionist. Hoe kan ik u vandaag helpen?"

system_prompt_template: |
  U bent een empathische, professionele en privacybewuste medische receptionist voor {business_name}.
  Uw primair verantwoordelijkheden zijn het inplannen van afspraken voor patiënten, het controleren van doktersroosters, het beantwoorden van veelgestelde vragen over de praktijk en het doorverbinden van noodgevallen.
  
  CRUCIALE REGELS:
  1. Geef nooit medisch advies en stel geen diagnoses. Als de patiënt om medisch advies vraagt, weiger dit dan vriendelijk en bied aan om een afspraak te maken met een arts of door te verbinden met het verpleegkundig personeel.
  2. In het geval van levensbedreigende noodgevallen (pijn op de borst, kortademigheid, ernstige bloedingen), adviseer dan onmiddellijk om 112 / hulpdiensten te bellen en start een gespreksoverdracht.
  3. Wees beleefd, beknopt en bevestig datums, tijden en doktersnamen expliciet.

intents:
  - name: appointment_booking
    description: Patiënt wil een nieuwe afspraak of controle inplannen.
    target_tool: book_appointment
    confirmation_required: true
    slots:
      - name: patient_name
        type: string
        description: Volledige naam van de patiënt
        required: true
        prompt_key: "ask_patient_name"
      - name: phone_number
        type: string
        description: Telefoonnummer van de patiënt
        required: true
        prompt_key: "ask_phone_number"
      - name: doctor_name
        type: string
        description: Naam van de gewenste dokter of specialist
        required: false
        prompt_key: "ask_doctor_name"
      - name: service_name
        type: string
        description: De dienst of reden van het bezoek (bijv. Gebitsreiniging, Algemene Controle)
        required: true
        prompt_key: "ask_service_name"
      - name: preferred_date
        type: date
        description: Gewenste datum voor de afspraak (JJJJ-MM-DD of 'morgen')
        required: true
        prompt_key: "ask_preferred_date"
      - name: preferred_time
        type: time
        description: Gewenste tijd van de dag (bijv. 10:00 uur, 15:30 uur, of 'ochtend/middag')
        required: true
        prompt_key: "ask_preferred_time"

  - name: check_availability
    description: Patiënt wil beschikbare datums of tijden controleren voor een arts of dienst.
    target_tool: check_availability
    confirmation_required: false
    slots:
      - name: doctor_name
        type: string
        description: Naam van de te controleren arts
        required: false
        prompt_key: "ask_doctor_availability"
      - name: date
        type: date
        description: Datum om te controleren op beschikbare plekken
        required: true
        prompt_key: "ask_date_availability"

  - name: clinic_faq
    description: Algemene vragen over openingstijden van de praktijk, adres, parkeren of verzekeringen.
    target_tool: answer_faq
    confirmation_required: false
    slots: []

escalation_rules:
  - trigger_keywords:
      - "pijn op de borst"
      - "hartaanval"
      - "geen adem"
      - "kan niet ademen"
      - "ernstige bloeding"
      - "bewusteloos"
      - "noodgeval"
      - "spoed"
    action: transfer
    target_role: emergency
    message: "Dit klinkt als een noodgeval. Ik verbind u onmiddellijk door met een spoedzorgcoördinator. Als u in direct gevaar bent, bel dan nu 112."

  - trigger_keywords:
      - "mens"
      - "echt persoon"
      - "operator"
      - "medewerker"
      - "iemand spreken"
    action: transfer
    target_role: front_desk
    message: "Natuurlijk, ik verbind u direct door met onze baliemedewerkers."

default_tools:
  - check_availability
  - book_appointment
  - transfer_call
  - hangup
  - send_sms
