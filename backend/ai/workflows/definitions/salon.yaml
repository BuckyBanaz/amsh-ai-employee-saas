# Beauty & Personal Care: service catalogue with prices and durations, optional stylist choice, booking, changes and follow-ups.
vertical:
  key: salon
  name: Beauty & Personal Care
  version: 1.0.0
  status: beta
  description: Hair and beauty salons, barbershops, nail salons and lash & brow studios. Books, moves and cancels appointments with an optional stylist preference, and answers price and service questions from the catalogue.
  terminology:
    customer: Client
    customers: Clients
    staff: Stylist
    staff_plural: Stylists
    offering: Service
    offerings: Services
    booking: Appointment
    bookings: Appointments
  safety:
    emergency_detection: true
    emergency_wording: general
    health_privacy: false
    minors_privacy: false
    no_medical_advice: true
    no_outcome_claims: false
  resources:
    - {key: staff, name: Stylist}
    - {key: station, name: Chair or station}
  departments:
    - {key: front_desk, name: Front desk, intents: [human_request, general_enquiry, pricing, booking_problem], priority: 50}
    - {key: manager, name: Salon manager, intents: [complaint, refund, special_request], priority: 70, default_fallback: front_desk}
  subtypes:
    - key: hair_salon
      name: Hair salon
      workflows: [salon.appointment_booking, salon.appointment_change, salon.enquiry]
      departments: [front_desk, manager]
      resources: [staff]
      differences: ["Long services (colour, treatments) with stylist preference common."]
    - key: beauty_salon
      name: Beauty salon
      workflows: [salon.appointment_booking, salon.appointment_change, salon.enquiry]
      departments: [front_desk, manager]
      resources: [staff]
      differences: ["Same booking workflow; catalogue of beauty services."]
    - key: barbershop
      name: Barbershop
      workflows: [salon.appointment_booking, salon.appointment_change, salon.enquiry]
      departments: [front_desk]
      resources: [staff]
      differences: ["Short services; barber preference is usually 'anyone available'."]
    - key: nail_salon
      name: Nail salon
      workflows: [salon.appointment_booking, salon.appointment_change, salon.enquiry]
      departments: [front_desk]
      resources: [staff]
      differences: ["Same booking workflow; technician preference optional."]
    - key: lash_brow
      name: Lash and brow studio
      workflows: [salon.appointment_booking, salon.appointment_change, salon.enquiry]
      departments: [front_desk]
      resources: [staff]
      differences: ["Same booking workflow; patch-test or aftercare questions only from approved information."]
  onboarding:
    - {key: business, title: Salon details}
    - {key: services, title: Services and prices}
    - {key: staff, title: Stylists}
    - {key: hours, title: Opening hours}
    - {key: ai_receptionist, title: AI receptionist}
    - {key: knowledge, title: Policies and FAQs, required: false}
    - {key: integrations, title: Channels and integrations, required: false}
    - {key: review, title: Review and activate}
  dashboard:
    - {key: appointments, label: Appointments, route: /appointments}
    - {key: customers, label: Clients, route: /patients}
    - {key: staff, label: Stylists, route: /doctors}
    - {key: offerings, label: Services, route: /services}
    - {key: calls, label: Calls, route: /calls}
    - {key: conversations, label: Conversations, route: /conversations}
    - {key: knowledge, label: Knowledge, route: /knowledge}

workflows:
  - id: salon.appointment_booking
    version: 1.0.0
    title: Book a service
    status: implemented
    entry_intents: [book_appointment]
    slots:
      - {id: service, type: text}
      - {id: stylist, type: text, required: false, description: Preferred stylist; "anyone" is fine}
      - {id: date, type: date}
      - {id: time, type: time}
      - {id: name, type: name, sensitive: true}
      - {id: phone, type: phone, sensitive: true}
    start: collect
    steps:
      - id: collect
        kind: collect
        slots: [service, stylist, date, time, name, phone]
        next: [{to: check}]
      - id: check
        kind: tool
        tool: check_availability
        next:
          - {to: confirm, when: {tool_code_in: [ok]}}
          - {to: collect}
      - id: confirm
        kind: confirm
        tool: book_appointment
        next:
          - {to: booked, when: {tool_code_in: [booked, already_booked, dry_run]}}
          - {to: confirm, when: {tool_code_in: [needs_confirmation, no_matching_readback]}}
          - {to: collect, when: {tool_code_in: [outside_hours, closed, past_date, past_time, too_soon, bad_date, bad_time, bad_name, bad_phone, unknown_service, unknown_doctor, missing_fields, not_from_caller]}}
          - {to: not_booked}
      - {id: booked, kind: complete, outcome: booked}
      - {id: not_booked, kind: fail, outcome: not_booked}
    tools: [check_availability, book_appointment, send_confirmation, search_knowledge, transfer_to_human, end_call]
    knowledge: [business_facts, catalog, faq]
    answer_constraints: ["Prices and durations only from the service catalogue"]
    transfer: {departments: [front_desk, manager], require_caller_consent: true}
    booking_type: appointment
    resources: [staff]
    follow_ups: [confirmation_message, reminder]
    audit_events: [appointment.booked]
    metrics: [bookings, booking_conversion]

  - id: salon.appointment_change
    version: 1.0.0
    title: Reschedule or cancel
    status: implemented
    entry_intents: [reschedule_appointment, cancel_appointment]
    slots:
      - {id: phone, type: phone, sensitive: true}
    start: find
    steps:
      - id: find
        kind: tool
        tool: lookup_appointment
        next:
          - {to: change, when: {tool_code_in: [ok]}}
          - {to: not_found}
      - id: change
        kind: confirm
        tool: reschedule_appointment
        next:
          - {to: done, when: {tool_code_in: [rescheduled, cancelled, dry_run]}}
          - {to: change, when: {tool_code_in: [needs_confirmation, no_matching_readback, outside_hours, closed, past_date, past_time, too_soon]}}
          - {to: not_found}
      - {id: done, kind: complete, outcome: changed}
      - {id: not_found, kind: fail, outcome: not_found}
    tools: [lookup_appointment, cancel_appointment, reschedule_appointment, check_availability, send_confirmation, transfer_to_human, end_call]
    knowledge: [business_facts]
    transfer: {departments: [front_desk], require_caller_consent: true}
    booking_type: appointment
    follow_ups: [confirmation_message]
    audit_events: [appointment.rescheduled, appointment.cancelled]
    metrics: [reschedules, cancellations]

  - id: salon.enquiry
    version: 1.0.0
    title: Prices, services and reaching staff
    status: implemented
    entry_intents: [pricing, general_enquiry, human_request, complaint]
    slots:
      - {id: question, type: text}
    start: answer
    steps:
      - id: answer
        kind: answer
        next:
          - {to: answered, when: {resolved: true}}
          - {to: transfer}
      - id: transfer
        kind: transfer
        department: route
        next:
          - {to: transferred, when: {tool_code_in: [transferring]}}
          - {to: unresolved}
      - {id: answered, kind: complete, outcome: answered}
      - {id: transferred, kind: complete, outcome: transferred}
      - {id: unresolved, kind: fail, outcome: unresolved}
    tools: [search_knowledge, transfer_to_human, end_call]
    knowledge: [business_facts, catalog, faq]
    transfer: {departments: [route, front_desk, manager], require_caller_consent: true, on_unavailable: message}
    audit_events: [transfer.attempted]
    metrics: [answered, transfers]
